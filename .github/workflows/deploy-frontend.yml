name: Pasty Frontend - Deploy (Vercel)

on:
  push:
    branches: [main, master]
    paths:
      - 'site-simples/pasty/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pasty-frontend
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  WORKING_DIR: site-simples/pasty/frontend

jobs:
  deploy:
    name: Lint, Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npx tsc -b

      - name: 🧹 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: 🚀 Deploy to Vercel
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          npm install --global vercel@latest
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            > /tmp/vercel-output.txt
          echo "Deployed to $(cat /tmp/vercel-output.txt)"
