<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary Meta Tags ─────────────────────────── -->
    <title>Pasty — Cole e salve textos no Google Docs, Drive ou Gmail</title>
    <meta
      name="description"
      content="Cole qualquer texto e salve diretamente no Google Docs, Google Drive ou Gmail. Acesse de qualquer dispositivo. Grátis, sem cadastro extra e sem instalar nada."
    />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="pt-BR" />
    <meta name="author" content="Pasty" />
    <meta name="keywords" content="salvar texto online, colar texto, Google Docs, Google Drive, Gmail, notas online, texto para pc, transferir texto, pasty" />
    <link rel="canonical" href="https://pasty.app/" />

    <!-- ─── Open Graph / Social ───────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pasty.app/" />
    <meta property="og:title" content="Pasty — Cole e salve textos no Google Docs, Drive ou Gmail" />
    <meta
      property="og:description"
      content="Cole qualquer texto e salve diretamente no Google Docs, Google Drive ou Gmail. Acesse de qualquer dispositivo. Grátis e sem cadastro extra."
    />
    <meta property="og:image" content="https://pasty.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Pasty" />

    <!-- ─── Twitter ──────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pasty — Cole e salve textos no Google Docs, Drive ou Gmail" />
    <meta
      name="twitter:description"
      content="Cole texto e salve direto no Google Docs, Drive ou Gmail. Grátis, rápido e sem complicação."
    />
    <meta name="twitter:image" content="https://pasty.app/og-image.png" />

    <!-- ─── Hreflang ──────────────────────────────────── -->
    <link rel="alternate" href="https://pasty.app/" hreflang="pt-BR" />
    <link rel="alternate" href="https://pasty.app/" hreflang="x-default" />

    <!-- ─── PWA / Manifest ────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pasty" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#7c3aed" />

    <!-- ─── Preconnect & Preload ──────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />

    <!-- ─── Fonts ─────────────────────────────────────── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ─── Structured Data (JSON-LD) ─────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pasty",
        "description": "Cole qualquer texto e salve diretamente no Google Docs, Google Drive ou Gmail.",
        "url": "https://pasty.app",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Modern browser required.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Organization",
          "name": "Pasty"
        }
      }
    </script>

    <!-- BreadcrumbList -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://pasty.app/" },
          { "@type": "ListItem", "position": 2, "name": "Política de Privacidade", "item": "https://pasty.app/privacy" },
          { "@type": "ListItem", "position": 3, "name": "Termos de Uso", "item": "https://pasty.app/terms" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
