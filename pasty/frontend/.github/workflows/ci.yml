name: Pasty Frontend - CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'site-simples/pasty/frontend/**'
      - '.github/workflows/pasty-frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'site-simples/pasty/frontend/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  WORKING_DIR: site-simples/pasty/frontend

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npx tsc -b

      - name: 🧹 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: 📦 Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasty-frontend-dist
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 7
